<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WiFi Setup</title><style>body{font-family:-apple-system,sans-serif;max-width:360px;margin:40px auto;padding:0 16px;color:#222}h2{text-align:center}label{display:block;margin-top:12px;font-weight:600}input{width:100%;padding:10px 8px;margin-top:4px;border:1px solid #ccc;border-radius:6px;font-size:16px;box-sizing:border-box}button{width:100%;margin-top:20px;padding:12px;background:#007aff;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:600}</style></head><body><h2>WiFi Setup</h2><form method="POST" action="/api/set_wifi_config" enctype="application/x-www-form-urlencoded"><label>WiFi Name (SSID)</label><input type="text" name="ssid" maxlength="32" required autofocus><label>WiFi Password</label><input type="password" name="password" maxlength="64" placeholder="blank=open network"><label>PC IP (for frames)</label><input type="text" name="pc_ip" maxlength="15" placeholder="e.g. 192.168.1.100"><button type="submit">Connect</button></form></body></html>
